function ch(expr){const out={};for(const key in expr)out[key]={expr:expr[key][0],pos:expr[key][1]};return out}
const endings={
1:{title:'Flavor Country',msg:'THE SIGNAL CROSSES THE HORIZON.',desc:'For one perfect second, every light on Earth turns the color of hot honey. Then the world tastes nothing at all.'},
2:{title:'Employee Discount',msg:'MIKA CLOCKS OUT.',desc:'The receipt prints forever. Mika gives the wing five stars, then asks if anyone else can hear the freezer laughing.'},
3:{title:'Split the Check',msg:'EARTH: STILL HERE. BILL: $47.',desc:'Three forks hit the plate at once. The reaction cancels itself out. Mika still adds the service charge.'},
4:{title:'Ranch Saves All',msg:'THE WORLD IS SAVED BY DAIRY.',desc:'The sauce settles. Noor stares at the ranch cup like it just rewrote physics. It has, a little.'},
5:{title:'Classified Flavor',msg:'CASE CLOSED. MOUTH OPEN.',desc:'The report records a successful containment test. The line about the agent licking the evidence is mysteriously missing.'},
6:{title:'Deep Fried',msg:'THE FRYER HOLDS.',desc:'Gus cuts the burner. The oil cools. One golden ring forms on its surface, then breaks like an ordinary bubble.'},
7:{title:'Going Viral',msg:'THE ALGORITHM WINS AGAIN.',desc:'The clip spreads faster than the alert. By morning, every copy has the same missing second—and the same extra eye.'},
8:{title:'Peer Reviewed',msg:'THE SAMPLE IS SEALED.',desc:'Seventeen warning labels, a locked cabinet, and a journal article nobody can explain. This is what passes for a quiet ending.'},
9:{title:'Controlled Experiment',msg:'RESULTS: CONSISTENT. SUBJECT: NOT.',desc:'The data is immaculate. Your notes stop halfway through a sentence, as if the rest of the thought belongs to someone else.'},
10:{title:'Wing Whisperer',msg:'THE WING LIVES. SO DOES THE WORLD.',desc:'You keep your promise. Under proper cold storage, Wingy dims to a small blue pulse—awake, but no longer pulling at the clock.'},
11:{title:'Betrayal',msg:'WINGY FORGIVES YOU.',desc:'It asks you to remember the taste. You do. That is the part that follows you home.'},
12:{title:'Pigeon Problem',msg:'LOCAL BIRD DECLINES COMMENT.',desc:'The pigeon glows beneath the parking-lot light. Gus quietly adds “bird-safe protocol” to tomorrow’s prep list.'},
13:{title:'Ordinary Night',msg:'YOU NEVER FIND OUT.',desc:'You go home. At 11:52, the clock in your kitchen stops for exactly one second. You decide not to investigate.'},
14:{title:'Wing Wedding',msg:'THE EARTH IS INVITED.',desc:'The vows are brief, the frosting is dairy-free, and the wing insists on a venue with reliable refrigeration.'},
15:{title:'Mika’s Heart',msg:'THE WORLD CAN WAIT.',desc:'Mika listens without laughing. The two of you watch the sky change color while Noor, offscreen, saves the world in a much less romantic way.'},
16:{title:'Nobel Flavor',msg:'THE PAPER IS ACCEPTED.',desc:'Noor’s containment method becomes the standard. She thanks the lab, the ranch, and the one brave volunteer whose name she leaves out.'},
17:{title:'Iron Stomach',msg:'GUS REMAINS UNIMPRESSED.',desc:'Gus asks for salt. The room starts moving again. He has already gone back to cleaning the fryer.'},
18:{title:'Just Wingy',msg:'JUST WINGY.',desc:'The menu disappears. The warning labels disappear. One small, unblinking eye remains where the New Game button used to be.'},
19:{title:'Groundhog Wing',msg:'IT IS 11:47 PM. AGAIN.',desc:'The same cold plate. The same clock. This time, the wing is already looking at you.'},
20:{title:'Good Taste',msg:'THE TRUE ENDING.',desc:'Noor stabilizes the sauce, Gus shuts down the heat line, and Kell signs the report. Wingy stays a wing. The clock moves.'},
21:{title:'Cold Storage',msg:'CONTAINMENT CONFIRMED.',desc:'Cool. Ground. Seal. Three simple actions, one impossible sample. The lights return one row at a time.'},
22:{title:'Chain of Custody',msg:'THE RECORD IS COMPLETE.',desc:'The locker opens. You log every transfer, seal the sample, and leave a paper trail too boring to become a legend.'},
23:{title:'Dead Air',msg:'THE SIGNAL GOES QUIET.',desc:'The low-high-low carrier locks onto the quarantine channel. Across town, freezers click on in sequence. No sirens follow.'},
24:{title:'The Missing Minute',msg:'THE CLOCK MOVES TO 11:48.',desc:'The records line up: delivery, alarm, alert. The loop was never a countdown; it was a held state. You release it, and the room finally exhales.'}
};
const END_NAMES=Object.fromEntries(Object.entries(endings).map(([k,v])=>[k,v.title]));
const N={};
function node(id,text,next,opts={}){N[id]={id,text,next,...opts};}
function choice(label,to,opts={}){return {label,to,...opts}}
node('start','At 11:47 p.m., every clock in Wingstead stops. The fryer keeps ticking. On your plate, a single boneless wing gives off a thin blue light—then goes dark.','a2',{bg:'diner',music:'jazz',chars:ch({M:['happy','r'],N:['blank','l']})});
node('a2','Mika sets down the plate. “New sauce came sealed from Aster Labs. Corporate says not to ask what Omega means.”','a3',{chars:ch({M:['smirk','r'],N:['blank','l']})});
node('a3','“That sounds like a reason to ask what it means.”','a4',{who:'You'});
node('a4','“Smart. Ask after closing,” Mika says. “If we make it to closing.”','a5',{who:'Mika',chars:ch({M:['blank','r'],N:['sad','l']})});
node('a5','Noor appears from the kitchen, still wearing one blue glove. “Don’t eat that. The sauce isn’t supposed to touch room temperature.”','a6',{who:'Noor',chars:ch({N:['shock','l'],M:['blank','r']})});
node('a6','“Then why is it on a plate?”','a7',{who:'You'});
node('a7','“Because I thought I’d killed the batch.” Noor looks at the plate. “I was wrong.”','hub',{who:'Noor',chars:ch({N:['sad','l'],M:['blank','r']}),music:'investigate',bg:'diner'});
node('hub','The clock is still stuck at 11:47. Noor will answer questions, but she will not touch the plate. Check at least two leads before deciding what to do.','',{bg:'diner',music:'investigate',chars:ch({M:['blank','r'],N:['sad','l']}),choices:[choice('Review the evidence','investigateMenu'),choice('Make your decision','decisionMenu',{when:s=>['aN','aM','aG','aK','aP'].filter(f=>s.flags[f]).length>=2}),choice('Reconstruct the incident timeline','timeline',{when:s=>['aN','aM','aG','aK','aP'].every(f=>s.flags[f])})]});
node('investigateMenu','Every lead points back to the same frozen minute. Which record do you want to check?','',{bg:'diner',music:'investigate',chars:ch({M:['blank','r'],N:['sad','l']}),choices:[choice('Ask Noor what Omega does','n1',{when:s=>!s.flags.aN}),choice('Ask Mika about the delivery','m1',{when:s=>!s.flags.aM}),choice('Check the kitchen logs','g1',{when:s=>!s.flags.aG}),choice('Question the agent outside','k1',{when:s=>!s.flags.aK}),choice('Check the emergency alert','ph1',{when:s=>!s.flags.aP}),choice('Back to the table','hub')]});
node('n1','“Omega doesn’t burn matter,” Noor says. “It borrows energy to hold a state perfectly still. The lab’s cooling unit failed during a test. The sauce should never have left the freezer.”','n2',{who:'Noor',setFlag:'aN',chars:ch({N:['sad','l'],M:['blank','r']}),music:'investigate'});
node('n2','“If it gets warm, it looks for a bigger source of heat. If someone digests it, that source could be the whole planet.” She meets your eyes. “I know how that sounds.”','investigateMenu',{who:'Noor',chars:ch({N:['shock','l'],M:['blank','r']})});
node('m1','Mika turns the delivery slip over. “Driver left this at 11:42. The freezer alarm went off five minutes later. I heard something knock from inside the walk-in.”','m2',{who:'Mika',setFlag:'aM',chars:ch({M:['sad','r'],N:['blank','l']}),music:'investigate'});
node('m2','“I told the manager. He told me the freezer was under warranty.” Mika folds the slip carefully. “That was the moment I stopped believing in management.”','investigateMenu',{who:'Mika',chars:ch({M:['smirk','r'],N:['blank','l']})});
node('g1','The kitchen smells like hot metal and cold rain. Gus has the fryer switched off. Its temperature gauge is still climbing.','g2',{bg:'kitchen',music:'kitchen',setFlag:'aG',chars:ch({G:['blank','c']})});
node('g2','“The freezer tripped at 11:47,” Gus says. “The fryer turned on by itself. I pulled the plug. Now the gauge says the oil is colder than ice.”','g3',{who:'Chef Gus',chars:ch({G:['sad','c']})});
node('g3','He points to the shutoff. “If that wing hits the oil, you’d better mean it. Heat is what the sauce is looking for.”','investigateMenu',{who:'Chef Gus',music:'investigate',bg:'diner',chars:ch({G:['smirk','c'],M:['blank','r'],N:['blank','l']})});
node('k1','A black sedan sits in the lot with its headlights off. The agent beside it shows you a badge that says OFFICE OF UNUSUAL INGREDIENTS.','k2',{bg:'lot',music:'tension',setFlag:'aK',chars:ch({K:['blank','c']})});
node('k2','“The incident is logged as 11-47,” Agent Kell says. “If you have the sample, don’t eat it, heat it, or let it out of your sight. I am aware those instructions are late.”','investigateMenu',{who:'Agent Kell',bg:'diner',music:'investigate',chars:ch({K:['smirk','c'],N:['blank','l'],M:['blank','r']})});
node('ph1','Your phone buzzes. An emergency alert from Aster Labs has no map, no contact number, and a timestamp five minutes ahead of the diner clock.','ph2',{setFlag:'aP',music:'alert',chars:ch({M:['blank','r'],N:['blank','l']})});
node('ph2','The alert gives a case number—11-47—and a quarantine channel: 88.7 MHz. Beneath it, a line has been crossed out: “Do not attempt to reset the original state.”','',{choices:[choice('Read the rest of the alert','ph3'),choice('Tune the quarantine signal','radioPuzzle'),choice('Put the phone away','investigateMenu')],music:'alert'});
node('ph3','The alert ends with a plain sentence: “If clocks disagree, preserve the order of events, not the displayed time.” Someone knew this would happen.','investigateMenu',{who:'Narration',music:'investigate'});
node('decisionMenu','You have enough to know the sample is dangerous. Noor waits for your call; Mika keeps her hands away from the plate. The blue light has not moved. What do you do?','',{bg:'diner',music:'investigate',chars:ch({N:['sad','l'],M:['blank','r']}),choices:[choice('Take a bite','decisionRevealEat'),choice('Refuse to touch it','decisionRevealNoEat'),choice('Try something no one expects','decisionRevealWeird'),choice('Get everyone working together','decisionRevealTeam')]});

node('decisionRevealWeird','You refuse to choose between eating it and destroying it. The blue point narrows, then opens. Something on the plate has noticed your hesitation.','weird',{bg:'diner',music:'glitch',glitch:true,chars:ch({N:['shock','l'],W:['blank','c'],M:['sad','r']})});
node('decisionRevealTeam','“Nobody touches it,” you say. “We solve this together.” The blue point narrows, then opens. Whatever is on the plate is listening.','true1',{bg:'diner',music:'glitch',glitch:true,chars:ch({N:['shock','l'],W:['blank','c'],M:['sad','r']})});

node('bite','You bite down. The taste is warm, bright, impossible to place. The lights stretch into thin lines.','b2',{music:'glitch',chars:ch({N:['shock','l'],M:['shock','r'],W:['shock','c']})});

function midiHz(n){return 440*Math.pow(2,(n-69)/12)}
function note(midi,time,dur,wave='sine',volume=.05,filter=5000){if(!AC||!masterGain||midi==null)return;try{const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();o.type=wave;o.frequency.setValueAtTime(midiHz(midi),time);f.type='lowpass';f.frequency.setValueAtTime(filter,time);g.gain.setValueAtTime(.0001,time);g.gain.linearRampToValueAtTime(volume,time+.012);g.gain.exponentialRampToValueAtTime(.0001,time+Math.max(.05,dur));o.connect(f);f.connect(g);g.connect(masterGain);g.connect(delayNode);o.start(time);o.stop(time+dur+.03)}catch(e){}}
function noiseTick(time,dur=.05,volume=.012){if(!AC||!masterGain)return;try{const n=Math.floor(AC.sampleRate*dur),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const src=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();src.buffer=b;f.type='highpass';f.frequency.value=1800;g.gain.setValueAtTime(volume,time);g.gain.exponentialRampToValueAtTime(.0001,time+dur);src.connect(f);f.connect(g);g.connect(masterGain);src.start(time);src.stop(time+dur)}catch(e){}}
function scheduleMusic(){if(!AC||!masterGain)return;const p=TRACKS[mood];if(!p)return;while(nextNote<AC.currentTime+.18){const quarter=60/p.bpm,eighth=quarter/2,i=step%32,bar=(step>>3)%4,chord=p.chords[bar];const t=nextNote+(p.swing&&i%2?.035:0);
 if(i%8===0){chord.forEach((n,j)=>note(p.root+12+n,t,quarter*3.1,j===0?'triangle':p.wave,mood==='glitch'?.022:.035,2600));}
 if(i%2===0)note(p.root+chord[0]-12,t,quarter*.72,'sine',mood==='doom'?.12:.14,mood==='kitchen'?900:420);
 const m=p.melody[i%p.melody.length];if(m!=null&&(mood!=='jazz'||i%2===0)){const wave=mood==='jazz'?(i%8===0?'triangle':'sine'):p.wave;note(p.root+m,t,eighth*(mood==='calm'?1.6:.85),wave,mood==='glitch'?.018:mood==='doom'?.026:.028,mood==='kitchen'?1900:4400)}
 if(mood==='jazz'&&i%8===4){note(60,t,quarter*.18,'triangle',.035,1100);noiseTick(t,.035,.008)}
 if(mood==='kitchen'&&i%4===2){note(30+(i%8),t,.1,'square',.025,900);noiseTick(t,.025,.018)}
 if(mood==='investigate'&&i%8===6)noiseTick(t,.045,.006);
 if(mood==='alert'&&i%4===0)noiseTick(t,.06,.012);
 if(mood==='tension'&&i%8===7)note(p.root+25,t,.08,'sine',.02,2500);
 if(mood==='puzzle'&&i%4===0)note(p.root+24,t,.045,'sine',.018,5000);
 if(mood==='glitch'&&Math.random()<.25)note(p.root+31+Math.floor(Math.random()*8),t,.06,'square',.009,1700);
 if(mood==='doom'&&i%8===6)noiseTick(t,.09,.009);
 step++;nextNote+=eighth;}}
function playCue(offset=60,dur=.1){startAudio();if(AC)note(offset,AC.currentTime+.01,dur,'sine',.045,3500)}
$('autoBtn').addEventListener('click',e=>{e.stopPropagation();autoMode=!autoMode;$('autoBtn').classList.toggle('on',autoMode);});
$('menuBtn').addEventListener('click',e=>{e.stopPropagation();openMenu('prefs')});
setInterval(()=>{if(!playing||!autoMode||menuOpen||activePuzzle||endingRunning||!advanceReady||activeNode?.choices)return;if(Date.now()-(window._lastAuto||0)>1900){window._lastAuto=Date.now();advance()}},150);

// Ending animation is sized from the actual stage, so it works in landscape and portrait without self-referencing dimensions.
let endingTimer=null,endingFrame=0;
function showEnding(number){const data=endings[number];if(!data)return;endingNow=number;endingRunning=true;playing=false;autoMode=false;$('autoBtn').classList.remove('on');clearInterval(typeTimer);$('choices').style.display='none';$('box').classList.add('hidden');$('toolbar').classList.add('hidden');$('puzzle').style.display='none';$('end').style.display='none';stage.classList.remove('glitch');
 discovered[number]=true;try{localStorage.setItem(FLAGS_KEY,JSON.stringify(discovered))}catch(e){}try{localStorage.removeItem(GAME_KEY)}catch(e){}changeMusic([1,2,5,7,9,11,12,18,19].includes(number)?'doom':'calm');startAudio();
 const dpr=Math.min(window.devicePixelRatio||1,2);const w=Math.max(1,stage.clientWidth),h=Math.max(1,stage.clientHeight);fx.width=Math.round(w*dpr);fx.height=Math.round(h*dpr);fx.style.display='block';fx.classList.remove('hidden');const c=fx.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);const t0=performance.now(),catastrophic=[1,2,5,7,9,11,12,18,19].includes(number);const particles=Array.from({length:180},()=>{const a=Math.random()*Math.PI*2,s=1+Math.random()*8;return{x:w/2,y:h/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:1+Math.random()*4,col:['#ff568e','#ffd59a','#64d9ee','#d6a2ff','#f8f5e9'][Math.floor(Math.random()*5)]}});
 function draw(now){if(!endingRunning)return;const t=now-t0;c.clearRect(0,0,w,h);c.fillStyle=`rgba(7,4,12,${catastrophic?.12:.06})`;c.fillRect(0,0,w,h);const cx=w/2,cy=h*.43,r=Math.min(w,h)*(catastrophic?.22:.19);
 if(catastrophic){const swell=1+Math.max(0,t-900)/3200;c.save();c.translate(cx,cy);c.scale(Math.min(2.2,swell),Math.min(2.2,swell));c.beginPath();c.arc(0,0,r,0,Math.PI*2);const gr=c.createRadialGradient(-r*.28,-r*.3,r*.1,0,0,r);gr.addColorStop(0,'#7bb9f3');gr.addColorStop(.65,'#2862a0');gr.addColorStop(1,'#101f53');c.fillStyle=gr;c.fill();c.strokeStyle='#7dc5ff';c.lineWidth=3;c.stroke();c.strokeStyle='#ffb45e';c.lineWidth=2;for(let i=0;i<7;i++){c.beginPath();c.moveTo(Math.cos(i*.9)*r*.1,Math.sin(i*.9)*r*.1);c.lineTo(Math.cos(i*.9+.4)*r*.6,Math.sin(i*.9+.4)*r*.7);c.stroke()}c.restore();if(t>1200){for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vx*=.992;p.vy*=.992;c.globalAlpha=Math.max(0,1-(t-1200)/3600);c.fillStyle=p.col;c.fillRect(p.x,p.y,p.r,p.r)}c.globalAlpha=1}}
 else{const pulse=1+Math.sin(t/370)*.08;c.beginPath();c.arc(cx,cy,r*pulse,0,Math.PI*2);const gr=c.createRadialGradient(cx-r*.3,cy-r*.3,3,cx,cy,r*pulse);gr.addColorStop(0,'#fff0c2');gr.addColorStop(.4,'#ee9dbb');gr.addColorStop(1,'#4e7fa7');c.fillStyle=gr;c.fill();c.strokeStyle='#ffb7d0';c.lineWidth=3;c.stroke();for(let i=0;i<12;i++){const a=i*Math.PI/6+t/1200;c.fillStyle='#ffd59a';c.globalAlpha=.35+.5*Math.sin(t/250+i);c.beginPath();c.arc(cx+Math.cos(a)*(r+18),cy+Math.sin(a)*(r+18),3,0,Math.PI*2);c.fill()}c.globalAlpha=1}
 if(t>700){c.textAlign='center';c.fillStyle='#fff4e6';c.font=`900 ${Math.max(15,Math.min(29,w*.025))}px Trebuchet MS`;c.shadowColor='#ff568e';c.shadowBlur=12;c.fillText(data.msg,cx,Math.min(h*.79,cy+r+70),w*.85);c.shadowBlur=0}
 if(t>4300){revealEndingCard();return}endingFrame=requestAnimationFrame(draw)}
 endingFrame=requestAnimationFrame(draw);endingTimer=setTimeout(revealEndingCard,4700);
}
function revealEndingCard(){if(!endingRunning)return;endingRunning=false;cancelAnimationFrame(endingFrame);clearTimeout(endingTimer);fx.classList.add('hidden');fx.style.display='none';const d=endings[endingNow];$('end').style.display='flex';$('en').textContent=`ENDING ${endingNow} / ${Object.keys(endings).length} · ${Object.keys(discovered).length} FOUND`;$('et').textContent=d.title;$('el').textContent=d.desc;try{localStorage.setItem(FLAGS_KEY,JSON.stringify(discovered))}catch(e){}refreshContinue();}

// Saves capture the live scene state, not the previous scene's state.
function snapshot(){return {id:state.id,flags:structuredClone(state.flags),chars:structuredClone(state.chars),bg:currentBg,music:mood}}
function persistAuto(){if(!playing||endingRunning)return;const snap=snapshot();try{localStorage.setItem(GAME_KEY,JSON.stringify(snap))}catch(e){}}
function saveSlot(i){if(!playing){menuMessage('Start a game before saving.');return}const s=snapshot();s.date=new Date().toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});s.scene=(N[state.id]?.text||'').slice(0,54);saves[i]=s;try{localStorage.setItem(SAVE_KEY,JSON.stringify(saves));persistAuto();renderMenu('save');menuMessage(`Saved to slot ${Number(i)+1}.`)}catch(e){menuMessage('The browser could not save this slot. Try freeing local storage space.')}}
function loadSlot(i){const d=saves[i];if(!d){menuMessage('That slot is empty.');return}loadSnapshot(d)}
function loadSnapshot(d){activePuzzle=null;autoMode=false;$('autoBtn').classList.remove('on');endingRunning=false;cancelAnimationFrame(endingFrame);clearTimeout(endingTimer);$('end').style.display='none';$('title').style.display='none';menuOpen=false;$('menu').style.display='none';state={id:d.id,flags:structuredClone(d.flags||{}),chars:structuredClone(d.chars||{}),bg:d.bg||'diner',music:d.music||'jazz'};currentBg=state.bg;setBG(currentBg);playing=true;startAudio();mood=d.music||'jazz';nextNote=AC?AC.currentTime+.05:0;enter(d.id)}
function refreshContinue(){const d=safeRead(GAME_KEY,null);$('continueBtn').disabled=!d;$('continueBtn').style.opacity=d?'1':'.45'}

// Small menu: story controls stay out of the way; the extra features live behind one button.
let menuTab='prefs';function openMenu(tab='prefs'){menuOpen=true;menuTab=tab;$('menu').style.display='grid';renderMenu(tab)}function closeMenu(){menuOpen=false;$('menu').style.display='none';if(playing)$('toolbar').classList.remove('hidden')}
function menuMessage(message){const n=$('menuNote');if(n)n.textContent=message}
function renderMenu(tab){menuTab=tab;document.querySelectorAll('#menuNav [data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const c=$('menuContent');
 if(tab==='prefs'){c.innerHTML=`<h3>Preferences</h3><label>Text speed <input type="range" min="0" max="100" value="${prefs.speed}" data-pref="speed"> <span>${prefs.speed}</span></label><label>Music volume <input type="range" min="0" max="100" value="${prefs.volume}" data-pref="volume"> <span>${prefs.volume}</span></label><label><input type="checkbox" data-pref="glitch" ${prefs.glitch?'checked':''}> Glitch effects</label><p class="small">Music starts after your first click. Browser sound settings may still mute it.</p><button class="btn" id="eraseData">Erase saves and endings</button><p id="menuNote" class="small"></p>`}
 else if(tab==='endings'){const found=Object.keys(discovered).map(Number);c.innerHTML=`<h3>Endings · ${found.length} / ${Object.keys(endings).length}</h3><div class="ending-list">${Object.entries(endings).map(([i,d])=>`<div class="ending-item ${discovered[i]?'found':''}">${discovered[i]?`${i}. ${d.title}`:`${i}. ???`}</div>`).join('')}</div><p class="small">Some endings need a specific choice. Four are unlocked by solving the puzzles.</p>`}
 else {const isSave=tab==='save';let html=`<h3>${isSave?'Save game':'Load game'}</h3><div class="slots">`;for(let i=0;i<6;i++){const d=saves[i];html+=`<button class="slot" data-slot="${i}" data-action="${isSave?'save':'load'}"><div class="empty">${d?'● Stored scene':'Empty slot'}</div><b>${i+1}. ${d?(d.date||'Saved game'):'Empty'}</b><span>${d?(d.scene||d.id):'No data'}</span></button>`}html+='</div><p id="menuNote" class="small">'+(isSave?'Save the current scene and your investigation clues.':'Select a saved scene to continue.')+'</p>';c.innerHTML=html}
}
$('menuNav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)renderMenu(b.dataset.tab)});$('closeMenu').addEventListener('click',closeMenu);$('titleMenuBtn').addEventListener('click',()=>openMenu('prefs'));$('menu').addEventListener('click',e=>{const b=e.target.closest('[data-slot]');if(b){const i=b.dataset.slot;if(b.dataset.action==='save')saveSlot(i);else loadSlot(i);return}if(e.target.id==='eraseData'){if(confirm('Erase every save and discovered ending? This cannot be undone.')){localStorage.removeItem(SAVE_KEY);localStorage.removeItem(FLAGS_KEY);localStorage.removeItem(GAME_KEY);saves={};discovered={};renderMenu('prefs');menuMessage('Save data erased.')}}});$('menuContent').addEventListener('input',e=>{const key=e.target.dataset.pref;if(!key)return;if(key==='glitch')prefs.glitch=e.target.checked?1:0;else prefs[key]=Number(e.target.value);setPrefs();if(e.target.nextElementSibling&&e.target.nextElementSibling.tagName==='SPAN')e.target.nextElementSibling.textContent=e.target.value});
function newGame(){startAudio();activePuzzle=null;state={id:'start',flags:{},chars:{},bg:'diner',music:'jazz'};currentBg='diner';setBG('diner');playing=true;endingRunning=false;autoMode=false;stage.classList.remove('glitch');$('title').style.display='none';$('end').style.display='none';$('menu').style.display='none';menuOpen=false;$('toolbar').classList.remove('hidden');changeMusic('jazz');enter('start')}
$('go').addEventListener('click',e=>{e.stopPropagation();newGame()});$('continueBtn').addEventListener('click',e=>{e.stopPropagation();const d=safeRead(GAME_KEY,null);if(d)loadSnapshot(d)});$('again').addEventListener('click',e=>{e.stopPropagation();newGame()});$('endMenuBtn').addEventListener('click',e=>{e.stopPropagation();$('end').style.display='none';$('title').style.display='flex';playing=false;refreshContinue()});
function goToTitle(){clearInterval(typeTimer);playing=false;activePuzzle=null;endingRunning=false;cancelAnimationFrame(endingFrame);clearTimeout(endingTimer);$('puzzle').style.display='none';$('end').style.display='none';$('box').classList.add('hidden');$('choices').style.display='none';$('toolbar').classList.add('hidden');$('menu').style.display='none';$('title').style.display='flex';$('chars').innerHTML='';refreshContinue();}
// Escape returns from menus; from title it has no effect. Audio preference updates without restarting the soundtrack.
setBG('diner');changeMusic('jazz');refreshContinue();renderMenu('prefs');
</script></body></html>
