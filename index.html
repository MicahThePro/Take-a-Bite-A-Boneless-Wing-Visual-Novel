function openGM(t){menu=1;$('gm').style.display='flex';tab(t)}
function closeGM(){menu=0;$('gm').style.display='none'}
function mm(){closeGM();playing=false;clearInterval(timer);auto=skip=0;qs();['box','qm','fx'].forEach(x=>$(x).classList.add('hide'));$('choices').style.display='none';$('end').style.display='none';$('chars').innerHTML='';stage.classList.remove('glitch');$('title').style.display='flex';music('jazz')}
$('gm').onclick=e=>{e.stopPropagation();const b=e.target.closest('button,.sl');if(!b)return;
 if(b.dataset.t)tab(b.dataset.t);else if(b.id=='gr')closeGM();else if(b.id=='gmm')mm();
 else if(b.classList.contains('sl')){const i=+b.dataset.i;if(gt=='save'){saveSlot(i);slots()}else loadSlot(i)}
 else if(b.dataset.p!==undefined){pg=+b.dataset.p;slots()}
 else if(b.id=='fsb'){try{document.documentElement.requestFullscreen()}catch(x){}}
 else if(b.id=='rst'){if(b.dataset.s){try{localStorage.removeItem('wgs');localStorage.removeItem('wg')}catch(x){}for(const k in F)delete F[k];tab('pf')}else{b.dataset.s=1;b.textContent='Tap again to erase'}}};
$('gm').oninput=e=>{const k=e.target.dataset.k;PF[k]=e.target.type=='checkbox'?+e.target.checked:+e.target.value;try{localStorage.setItem('wgp',JSON.stringify(PF))}catch(x){}setVol()};
$('qm').onclick=e=>{e.stopPropagation();const b=e.target.closest('button');if(!b)return;if(b.id=='qa'){auto=!auto;skip=0}else if(b.id=='qk'){skip=!skip;auto=0}else if(b.dataset.g)openGM(b.dataset.g);qs()};
$('tl').onclick=e=>{e.stopPropagation();openGM('load')};$('tp').onclick=e=>{e.stopPropagation();openGM('pf')};
addEventListener('keydown',e=>{if(e.key=='Escape'){menu?closeGM():openGM('pf')}});
setInterval(()=>{if(!playing||lock||menu)return;if(skip){advance();if(N[cur].choices&&typing>=full.length){skip=0;qs()}}else if(auto&&typing>=full.length&&!N[cur].choices&&Date.now()-doneAt>4000-PF.auto*35)advance()},110);
setBG('diner');
</script></body></html>
